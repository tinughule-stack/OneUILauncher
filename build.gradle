    namespace 'com.oneui.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.oneui.launcher'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
